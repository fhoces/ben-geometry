<g stroke="#000" stroke-width="0.3"><line x1="12" y1="213.0" x2="112" y2="213.0"/><line x1="12" y1="211.0" x2="12" y2="215.0"/><line x1="112" y1="211.0" x2="112" y2="215.0"/></g>
<text x="114" y="214.2" font-size="3.2">100 mm</text>
<text x="12" y="226.0" font-size="3.1" fill="#000">1. Bisect OB to find its middle H, then bisect OH to find I. Bisect angle OIA twice; it hits line OA at E.</text>
<text x="12" y="232.2" font-size="3.1" fill="#000">2. At I, build a right angle to IE and bisect it: 45 degrees. That line hits line OA (past O) at F.</text>
<text x="12" y="238.4" font-size="3.1" fill="#000">3. Arcs from A and from F (same width) give the middle of AF: M. Circle centered M through A meets OB at K.</text>
<text x="12" y="244.6" font-size="3.1" fill="#000">4. Circle centered E through K meets line OA at N3 and N5. Raise perpendiculars there to the circle: P3, P5.</text>
<text x="12" y="250.8" font-size="3.1" fill="#000">5. P3 is 3/17 of the way round from A, P5 is 5/17. Copy chord P3P5 from A to reach vertex 2; then vertex 2</text>
<text x="12" y="257.0" font-size="3.1" fill="#000">    to P3 is one side. Walk that width round the circle. The grey ticks show where all 17 vertices belong.</text>
<text x="12" y="263.2" font-size="3.1" fill="#555">Note: M and N3 really are only about 0.6 mm apart. That is not a printing error.</text>
</svg>